[package]
name = "uu-archive-clickteam-install-creator-v2"
version = "0.1.0"
edition = "2024"
authors = ["UU <uu230196@gmail.com>"]
description = "Unpacker for Clickteam Install Creator 2 self-extracting installers"
repository = "https://github.com/UU-0665D27/uu-archive-clickteam-install-creator-v2"
readme = "README.md"
license = "MIT"
keywords = ["clickteam", "installer", "unpacker", "archive", "sfx"]
categories = ["compression", "parser-implementations"]
exclude = ["/fuzz"]

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
perf = "deny"
style = "deny"

[dependencies]
bzip2 = "0.6"
encoding_rs = "0.8"
filetime = "0.2"
flate2 = "1.1"
globset = "0.4"
thiserror = "2"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
